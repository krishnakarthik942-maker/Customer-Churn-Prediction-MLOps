name: Customer Churn MLOps Pipeline

on:
  push:
  pull_request:

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --force-reinstall "SQLAlchemy==2.0.36"

      - name: Verify dependencies
        run: |
          python -m pip show mlflow SQLAlchemy
          python -m pip check
          python -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__); assert sqlalchemy.__version__.startswith('2.0.'), 'Expected SQLAlchemy 2.0.x'"
          python -c "from sqlalchemy.pool import FallbackAsyncAdaptedQueuePool; print('FallbackAsyncAdaptedQueuePool import OK')"
          python -c "import mlflow; print('MLflow:', mlflow.__version__)"
          python -c "from mlflow.tracking import MlflowClient; print('MLflow tracking import OK')"

      - name: Generate sample data
        run: python generate_data.py

      - name: Validate data
        run: python validation.py

      - name: Train model and enforce quality gate
        run: python train.py --check-quality-gate

      - name: Run automated tests
        run: python -m pytest -v